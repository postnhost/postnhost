<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Page not found | PostnHost</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #fff;
        color: #111827;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        text-align: center;
      }

      img {
        width: min(11.25rem, 55vw);
        height: auto;
        margin-bottom: 3rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(4.5rem, 18vw, 8rem);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 0.85;
      }

      p {
        margin: 1.25rem 0 0;
        color: #6b7280;
        font-size: 1.125rem;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <main>
      <img src="/logo.webp" width="180" height="37" alt="PostnHost">
      <h1>404</h1>
      <p>Not found</p>
    </main>
  </body>
</html>
